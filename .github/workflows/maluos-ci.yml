# MaluOS Slides quality gates: `cargo xtask ci` on Ubuntu (fmt, pdf-deps, clippy, tests,
# doctests, assets, layers, wasm). Linux is the only platform this fork builds for (plan D1).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The same craft-fonts commit the release build embeds; .cargo/config.toml's relative
      # default does not override an explicit value.
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 43913056ce82a3fdad0ef69f6b88d1dc922a8104
          path: craft-fonts
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev pkg-config cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask ci
        run: cargo xtask ci
