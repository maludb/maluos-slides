[package]
name = "maluos-slides-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MaluOS Slides text layout: runs to shaped glyph lines with bullets, indents, spacing, alignment, anchoring, autofit and caret hit testing"

[lints]
workspace = true

[dependencies]
maluos-slides-model = { workspace = true }
maluos-slides-geom = { workspace = true }
maluos-slides-color = { workspace = true }
maluos-slides-fonts = { workspace = true }
unicode-linebreak = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-bidi = { workspace = true }
# Unconditional: `is_valid`/`weekday` use chrono on every target, including wasm32.
# Only the wasm-safe `std` baseline here (inherited from the workspace entry).
chrono = { workspace = true }

# The local clock for date fields (no clock on wasm: fields keep their saved text).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { workspace = true, features = ["clock"] }
