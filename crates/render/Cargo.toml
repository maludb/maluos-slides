[package]
name = "maluos-slides-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MaluOS Slides renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints]
workspace = true

[dependencies]
maluos-slides-geom = { workspace = true }
maluos-slides-color = { workspace = true }
maluos-slides-metafile = { workspace = true }
maluos-slides-model = { workspace = true }
maluos-slides-anim = { workspace = true }
maluos-slides-fonts = { workspace = true }
maluos-slides-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
log = { workspace = true }
kurbo = { workspace = true }
skrifa = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
