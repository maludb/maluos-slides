[package]
name = "maluos-slides-assist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MaluOS Slides assistant: the tool table shared with the MCP server, the command catalog and its schemas, tool execution through engine commands"

[lints]
workspace = true

[features]
default = ["native"]
# The real clients (ureq); off on wasm32, where the policy, catalog and loop still compile.
native = ["maluos-llm/native", "dep:ureq"]

[dependencies]
maluos-slides-engine = { workspace = true }
maluos-slides-mcp = { workspace = true }
maluos-llm = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# The office's agents over HTTP (step 4.5); the vault is reached over its Unix socket with std.
# Off on wasm32 like maluos-llm's transport: the `office` module is native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.5", optional = true }
