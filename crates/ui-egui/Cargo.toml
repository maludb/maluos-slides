[package]
name = "maluos-slides-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MaluOS Slides egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
maluos-slides-geom = { workspace = true }
maluos-slides-color = { workspace = true }
maluos-slides-model = { workspace = true }
maluos-slides-fonts = { workspace = true }
maluos-slides-text = { workspace = true }
maluos-slides-render = { workspace = true }
maluos-slides-anim = { workspace = true }
maluos-slides-engine = { workspace = true }
maluos-slides-media = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
